spring.application.name=kivo-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kivo}
spring.datasource.username=${DB_USERNAME:kivo}
spring.datasource.password=${DB_PASSWORD:kivo}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

server.shutdown=graceful

kivo.navigation.routing.standard-speed-meters-per-second=1.4
kivo.navigation.routing.accessible-speed-meters-per-second=1.0
kivo.navigation.routing.stairs-penalty-seconds=20
kivo.navigation.routing.escalator-penalty-seconds=15
kivo.navigation.routing.elevator-penalty-seconds=45
kivo.navigation.routes.ttl=30m
kivo.navigation.routes.maximum-size=10000
kivo.navigation.routes.overlay-max-dimension=2048
