spring.application.name=kivo-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kivo}
spring.datasource.username=${DB_USERNAME:kivo}
spring.datasource.password=${DB_PASSWORD:kivo}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,navigationGraph

server.shutdown=graceful
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.remoteip.host-header=x-forwarded-host
server.tomcat.remoteip.port-header=x-forwarded-port
server.tomcat.remoteip.internal-proxies=${KIVO_TRUSTED_PROXY_REGEX:127\\.0\\.0\\.1|::1}

kivo.security.admin.username=${KIVO_ADMIN_USERNAME}
kivo.security.admin.password-hash=${KIVO_ADMIN_PASSWORD_HASH}
kivo.security.require-https=false
kivo.security.hsts.max-age=365d
kivo.security.hsts.include-subdomains=true
kivo.security.hsts.preload=true

kivo.http.cors.allowed-origins=${KIVO_CORS_ALLOWED_ORIGINS:}
kivo.http.cors.allowed-methods=GET,POST,OPTIONS
kivo.http.cors.allowed-headers=Accept,Authorization,Content-Type,X-Correlation-ID
kivo.http.cors.exposed-headers=Location,Retry-After,X-Correlation-ID
kivo.http.cors.allow-credentials=false

kivo.http.rate-limit.enabled=true
kivo.http.rate-limit.maximum-clients=50000
kivo.http.rate-limit.policies.search.method=GET
kivo.http.rate-limit.policies.search.path=/api/v1/malls/{mallCode}/places
kivo.http.rate-limit.policies.search.capacity=120
kivo.http.rate-limit.policies.search.window=1m
kivo.http.rate-limit.policies.routes.method=POST
kivo.http.rate-limit.policies.routes.path=/api/v1/routes
kivo.http.rate-limit.policies.routes.capacity=30
kivo.http.rate-limit.policies.routes.window=1m
kivo.http.rate-limit.policies.sharing.method=POST
kivo.http.rate-limit.policies.sharing.path=/api/v1/routes/{routeId}/share
kivo.http.rate-limit.policies.sharing.capacity=20
kivo.http.rate-limit.policies.sharing.window=1m
kivo.http.rate-limit.policies.feedback.method=POST
kivo.http.rate-limit.policies.feedback.path=/api/v1/feedback
kivo.http.rate-limit.policies.feedback.capacity=30
kivo.http.rate-limit.policies.feedback.window=1m

kivo.readiness.navigation.minimum-active-graphs=1

kivo.navigation.routing.standard-speed-meters-per-second=1.4
kivo.navigation.routing.accessible-speed-meters-per-second=1.0
kivo.navigation.routing.stairs-penalty-seconds=20
kivo.navigation.routing.escalator-penalty-seconds=15
kivo.navigation.routing.elevator-penalty-seconds=45
kivo.navigation.routes.ttl=30m
kivo.navigation.routes.maximum-size=10000
kivo.navigation.routes.overlay-max-dimension=2048
kivo.sharing.ttl=2h
kivo.sharing.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
kivo.sharing.qr-size=384
