spring.datasource.url=${DEMO_DB_URL:jdbc:postgresql://localhost:5432/kivo?currentSchema=kivo_demo}
spring.datasource.username=${DEMO_DB_USERNAME:kivo}
spring.datasource.password=${DEMO_DB_PASSWORD:kivo}

spring.jpa.properties.hibernate.default_schema=kivo_demo

spring.flyway.locations=classpath:db/migration,classpath:db/demo
spring.flyway.default-schema=kivo_demo
spring.flyway.schemas=kivo_demo
spring.flyway.create-schemas=true
