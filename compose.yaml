services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kivo
      POSTGRES_USER: kivo
      POSTGRES_PASSWORD: kivo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kivo -d kivo"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - kivo-postgres-data:/var/lib/postgresql/data

volumes:
  kivo-postgres-data:
