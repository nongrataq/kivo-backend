openapi: 3.1.0
info:
  title: Kivo Backend API
  version: 1.0.0
  description: >-
    Стабильный JSON API системы навигации Kivo для Intuiface. Клиент может передать
    X-Correlation-ID (8–128 безопасных ASCII-символов); сервер всегда возвращает принятый
    или сгенерированный идентификатор в одноимённом response header.
servers:
  - url: /api/v1
paths:
  /kiosks/{kioskCode}/bootstrap:
    get:
      operationId: getKioskBootstrap
      summary: Получить конфигурацию активного киоска
      parameters:
        - name: kioskCode
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - $ref: '#/components/parameters/Language'
      responses:
        '200':
          description: Плоская стартовая конфигурация киоска
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KioskBootstrap'
              example:
                kioskCode: demo-kiosk
                mallCode: demo-mall
                mallName: Демо ТЦ
                defaultLanguage: ru
                selectedLanguage: en
                currentFloorCode: L1
                languages:
                  - code: ru
                    displayLabel: RU
                    displayOrder: 10
                  - code: en
                    displayLabel: EN
                    displayOrder: 30
                floors:
                  - code: L1
                    name: Первый этаж
                    levelNumber: 1
                    displayOrder: 10
                    mapImageUrl: https://cdn.example.com/maps/demo-mall/L1.png
                    coordinateWidth: 10000
                    coordinateHeight: 10000
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: Киоск не найден или неактивен
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /malls/{mallCode}/categories:
    get:
      operationId: getCategories
      summary: Получить активные категории торгового центра
      parameters:
        - $ref: '#/components/parameters/MallCode'
        - $ref: '#/components/parameters/Language'
      responses:
        '200':
          description: Категории в порядке отображения
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
              example:
                - id: 00000000-0000-0000-0000-000000000101
                  code: food
                  name: Гастрономия
                  displayOrder: 10
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: Торговый центр не найден
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /malls/{mallCode}/places:
    get:
      operationId: getPlaces
      summary: Найти активные места торгового центра
      parameters:
        - $ref: '#/components/parameters/MallCode'
        - name: q
          in: query
          required: false
          description: Поиск без учёта регистра по коду, названию и описанию места.
          schema:
            type: string
            maxLength: 100
        - name: categoryId
          in: query
          required: false
          description: Категория должна принадлежать указанному торговому центру.
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Language'
      responses:
        '200':
          description: Не более 50 мест в порядке отображения
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  $ref: '#/components/schemas/Place'
              example:
                - id: 00000000-0000-0000-0000-000000000401
                  code: grocery
                  name: Grocery store
                  description: Fresh groceries
                  floorCode: L1
                  categoryId: 00000000-0000-0000-0000-000000000101
                  categoryCode: food
                  displayOrder: 10
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: Торговый центр или категория не найдены
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /malls/{mallCode}/events/today:
    get:
      operationId: getTodayEvents
      summary: Получить опубликованные события локальных суток торгового центра
      parameters:
        - $ref: '#/components/parameters/MallCode'
        - $ref: '#/components/parameters/Language'
      responses:
        '200':
          description: Не более 50 маршрутизируемых событий в хронологическом порядке
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  $ref: '#/components/schemas/Event'
              example:
                - id: 75000000-0000-0000-0000-000000000001
                  code: tasting
                  title: Дегустация
                  description: Новинки фермерских продуктов
                  startsAt: '2026-08-10T10:00:00Z'
                  endsAt: '2026-08-10T11:00:00Z'
                  placeId: 00000000-0000-0000-0000-000000000401
                  placeCode: grocery
                  placeName: Продуктовый магазин
                  floorCode: L1
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: Торговый центр не найден
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /places/{placeId}:
    get:
      operationId: getPlace
      summary: Получить одно активное место
      parameters:
        - name: placeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Language'
      responses:
        '200':
          description: Локализованная карточка места
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
              example:
                id: 00000000-0000-0000-0000-000000000401
                code: grocery
                name: Grocery store
                description: Fresh groceries
                floorCode: L1
                categoryId: 00000000-0000-0000-0000-000000000101
                categoryCode: food
                displayOrder: 10
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: Место не найдено или неактивно
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /routes:
    post:
      operationId: createRoute
      summary: Построить и временно сохранить маршрут от киоска до места
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoute'
            example:
              kioskCode: demo-kiosk
              placeId: 00000000-0000-0000-0000-000000000401
              profile: STANDARD
      responses:
        '201':
          description: Маршрут создан
          headers:
            Location:
              description: URL созданного маршрута
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
              example:
                routeId: 73000000-0000-0000-0000-000000000001
                kioskCode: demo-kiosk
                placeId: 00000000-0000-0000-0000-000000000401
                profile: STANDARD
                totalDistanceMeters: 20.00
                estimatedDurationSeconds: 15
                createdAt: '2026-08-10T10:00:00Z'
                expiresAt: '2026-08-10T10:30:00Z'
                instructions:
                  - sequence: 0
                    type: START
                    floorCode: L1
                    targetFloorCode: null
                    movementType: null
                    distanceMeters: null
                  - sequence: 1
                    type: CONTINUE
                    floorCode: L1
                    targetFloorCode: null
                    movementType: CORRIDOR
                    distanceMeters: 20.00
                  - sequence: 2
                    type: ARRIVE
                    floorCode: L1
                    targetFloorCode: null
                    movementType: null
                    distanceMeters: null
                overlays:
                  - floorCode: L1
                    displayOrder: 10
                    imageUrl: /api/v1/routes/73000000-0000-0000-0000-000000000001/floors/L1/overlay.png
                    pixelWidth: 2048
                    pixelHeight: 2048
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: Киоск, место или допустимый маршрут не найдены
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Киоск и место принадлежат разным торговым центрам
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Активный навигационный граф недоступен
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /routes/{routeId}:
    get:
      operationId: getRoute
      summary: Получить временный маршрут
      parameters:
        - $ref: '#/components/parameters/RouteId'
      responses:
        '200':
          description: Сохранённый маршрут
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
              example:
                routeId: 73000000-0000-0000-0000-000000000001
                kioskCode: demo-kiosk
                placeId: 00000000-0000-0000-0000-000000000401
                profile: STANDARD
                totalDistanceMeters: 20.00
                estimatedDurationSeconds: 15
                createdAt: '2026-08-10T10:00:00Z'
                expiresAt: '2026-08-10T10:30:00Z'
                instructions:
                  - sequence: 0
                    type: START
                    floorCode: L1
                    targetFloorCode: null
                    movementType: null
                    distanceMeters: null
                  - sequence: 1
                    type: CONTINUE
                    floorCode: L1
                    targetFloorCode: null
                    movementType: CORRIDOR
                    distanceMeters: 20.00
                  - sequence: 2
                    type: ARRIVE
                    floorCode: L1
                    targetFloorCode: null
                    movementType: null
                    distanceMeters: null
                overlays:
                  - floorCode: L1
                    displayOrder: 10
                    imageUrl: /api/v1/routes/73000000-0000-0000-0000-000000000001/floors/L1/overlay.png
                    pixelWidth: 2048
                    pixelHeight: 2048
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: Маршрут не найден, истёк или был вытеснен из временного хранилища
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /routes/{routeId}/floors/{floorCode}/overlay.png:
    get:
      operationId: getRouteOverlay
      summary: Получить прозрачный PNG-слой маршрута для этажа
      parameters:
        - $ref: '#/components/parameters/RouteId'
        - name: floorCode
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 32
      responses:
        '200':
          description: Прозрачный PNG-слой
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: Маршрут или этаж маршрута не найдены
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /routes/{routeId}/share:
    post:
      operationId: shareRoute
      summary: Создать временную мобильную ссылку и QR-код для маршрута
      parameters:
        - $ref: '#/components/parameters/RouteId'
      responses:
        '201':
          description: Ссылка для передачи маршрута создана
          headers:
            Location:
              description: Абсолютный URL мобильной страницы
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareRoute'
              example:
                shareId: 74000000-0000-0000-0000-000000000001
                routeUrl: https://routes.example/r/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                qrImageUrl: https://routes.example/api/v1/public/routes/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/qr.png
                expiresAt: '2026-08-10T12:00:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: Исходный временный маршрут не найден или истёк
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /public/routes/{shareToken}:
    get:
      operationId: getSharedRoute
      summary: Получить неизменяемый snapshot переданного маршрута
      parameters:
        - $ref: '#/components/parameters/ShareToken'
      responses:
        '200':
          description: Публичный мобильный маршрут
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedRoute'
              example:
                shareId: 74000000-0000-0000-0000-000000000001
                routeId: 73000000-0000-0000-0000-000000000001
                mallId: 00000000-0000-0000-0000-000000000001
                graphVersionId: 30000000-0000-0000-0000-000000000001
                kioskCode: demo-kiosk
                placeId: 00000000-0000-0000-0000-000000000401
                profile: STANDARD
                totalDistanceMeters: 20.00
                estimatedDurationSeconds: 15
                createdAt: '2026-08-10T10:00:00Z'
                expiresAt: '2026-08-10T12:00:00Z'
                instructions:
                  - sequence: 0
                    type: START
                    floorCode: L1
                    targetFloorCode: null
                    movementType: null
                    distanceMeters: null
                  - sequence: 1
                    type: CONTINUE
                    floorCode: L1
                    targetFloorCode: null
                    movementType: CORRIDOR
                    distanceMeters: 20.00
                  - sequence: 2
                    type: ARRIVE
                    floorCode: L1
                    targetFloorCode: null
                    movementType: null
                    distanceMeters: null
                overlays:
                  - floorCode: L1
                    displayOrder: 10
                    mapImageUrl: https://cdn.example.com/maps/demo-mall/L1.png
                    imageUrl: https://routes.example/api/v1/public/routes/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/floors/L1/overlay.png
                    pixelWidth: 256
                    pixelHeight: 256
        '404':
          description: Токен неизвестен, истёк или отозван
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/routes/{shareToken}/qr.png:
    get:
      operationId: getSharedRouteQr
      summary: Получить QR-код, содержащий URL мобильной страницы
      parameters:
        - $ref: '#/components/parameters/ShareToken'
      responses:
        '200':
          description: QR-код в PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: Токен неизвестен, истёк или отозван
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/routes/{shareToken}/floors/{floorCode}/overlay.png:
    get:
      operationId: getSharedRouteOverlay
      summary: Получить PNG-слой этажа из сохранённого snapshot маршрута
      parameters:
        - $ref: '#/components/parameters/ShareToken'
        - name: floorCode
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 32
      responses:
        '200':
          description: Прозрачный PNG-слой
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: Токен или этаж маршрута не найдены
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /admin/malls/{mallCode}/navigation/graphs/{versionId}/publish:
    post:
      operationId: publishNavigationGraph
      summary: Атомарно опубликовать проверенную версию навигационного графа
      description: >-
        Только для отдельного staff-устройства. Stateless HTTP Basic credentials должны
        передаваться исключительно по HTTPS и не сохраняются в сессии.
      security:
        - adminBasic: []
      parameters:
        - $ref: '#/components/parameters/MallCode'
        - name: versionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Граф опубликован и активный in-memory snapshot атомарно заменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphPublication'
              example:
                mallCode: demo-mall
                versionId: 30000000-0000-0000-0000-000000000001
                versionCode: v1
                nodeCount: 12
                edgeCount: 18
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Отсутствуют или неверны staff credentials
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Аккаунт не имеет роли STAFF
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Торговый центр или версия графа не найдены
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Кандидат не прошёл валидацию графа
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /r/{shareToken}:
    get:
      operationId: getSharedRouteMobilePage
      summary: Открыть минимальную адаптивную страницу маршрута
      servers:
        - url: /
      parameters:
        - $ref: '#/components/parameters/ShareToken'
      responses:
        '200':
          description: Мобильная HTML-страница
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Токен неизвестен, истёк или отозван
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /feedback:
    post:
      operationId: createFeedback
      summary: Сохранить анонимную оценку маршрута
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFeedback'
            example:
              routeId: 73000000-0000-0000-0000-000000000001
              shareId: null
              rating: 5
      responses:
        '204':
          description: Оценка сохранена; тело ответа отсутствует
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: Контекст маршрута не найден, истёк или не согласован
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    adminBasic:
      type: http
      scheme: basic
      description: Staff credentials из deployment secret storage; только поверх HTTPS.
  parameters:
    MallCode:
      name: mallCode
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    Language:
      name: lang
      in: query
      required: false
      description: >-
        Код языка из двух или трёх строчных латинских букв. Если параметр отсутствует,
        используется язык ТЦ; если перевода нет — язык ТЦ, затем стабильный code.
      schema:
        type: string
        pattern: '^[a-z]{2,3}$'
    RouteId:
      name: routeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShareToken:
      name: shareToken
      in: path
      required: true
      description: Высокоэнтропийный непрозрачный токен из QR-ссылки
      schema:
        type: string
        minLength: 32
        maxLength: 128
  responses:
    ValidationError:
      description: Ошибка валидации параметров
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimitExceeded:
      description: Превышен лимит запросов для клиента и policy
      headers:
        Retry-After:
          description: Секунды до открытия текущего окна
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Rate limit exceeded
            status: 429
            detail: Too many requests; retry after 60 second(s)
            code: RATE_LIMIT_EXCEEDED
            correlationId: 0f60ab4e-9c8d-44da-8eb5-0e7d986ac79a
  schemas:
    GraphPublication:
      type: object
      required: [mallCode, versionId, versionCode, nodeCount, edgeCount]
      properties:
        mallCode:
          type: string
        versionId:
          type: string
          format: uuid
        versionCode:
          type: string
        nodeCount:
          type: integer
          format: int32
          minimum: 0
        edgeCount:
          type: integer
          format: int32
          minimum: 0
    KioskBootstrap:
      type: object
      required:
        - kioskCode
        - mallCode
        - mallName
        - defaultLanguage
        - selectedLanguage
        - currentFloorCode
        - languages
        - floors
      properties:
        kioskCode:
          type: string
        mallCode:
          type: string
        mallName:
          type: string
        defaultLanguage:
          type: string
        selectedLanguage:
          type: string
        currentFloorCode:
          type: string
        languages:
          type: array
          items:
            $ref: '#/components/schemas/Language'
        floors:
          type: array
          items:
            $ref: '#/components/schemas/Floor'
    Language:
      type: object
      required: [code, displayLabel, displayOrder]
      properties:
        code:
          type: string
        displayLabel:
          type: string
        displayOrder:
          type: integer
          format: int32
    Floor:
      type: object
      required:
        - code
        - name
        - levelNumber
        - displayOrder
        - coordinateWidth
        - coordinateHeight
      properties:
        code:
          type: string
        name:
          type: string
        levelNumber:
          type: integer
          format: int32
        displayOrder:
          type: integer
          format: int32
        mapImageUrl:
          type: [string, 'null']
          format: uri
        coordinateWidth:
          type: integer
          format: int32
        coordinateHeight:
          type: integer
          format: int32
    Category:
      type: object
      required: [id, code, name, displayOrder]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        displayOrder:
          type: integer
          format: int32
    Place:
      type: object
      required: [id, code, name, floorCode, categoryId, categoryCode, displayOrder]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        floorCode:
          type: string
        categoryId:
          type: string
          format: uuid
        categoryCode:
          type: string
        displayOrder:
          type: integer
          format: int32
    Event:
      type: object
      required:
        - id
        - code
        - title
        - startsAt
        - endsAt
        - placeId
        - placeCode
        - placeName
        - floorCode
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        title:
          type: string
        description:
          type: [string, 'null']
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        placeId:
          type: string
          format: uuid
        placeCode:
          type: string
        placeName:
          type: string
        floorCode:
          type: string
    CreateRoute:
      type: object
      required: [kioskCode, placeId]
      properties:
        kioskCode:
          type: string
          minLength: 1
          maxLength: 64
        placeId:
          type: string
          format: uuid
        profile:
          $ref: '#/components/schemas/MovementProfile'
    MovementProfile:
      type: string
      enum: [STANDARD, ACCESSIBLE]
      default: STANDARD
    Route:
      type: object
      required:
        - routeId
        - kioskCode
        - placeId
        - profile
        - totalDistanceMeters
        - estimatedDurationSeconds
        - createdAt
        - expiresAt
        - instructions
        - overlays
      properties:
        routeId:
          type: string
          format: uuid
        kioskCode:
          type: string
        placeId:
          type: string
          format: uuid
        profile:
          $ref: '#/components/schemas/MovementProfile'
        totalDistanceMeters:
          type: number
          minimum: 0
          multipleOf: 0.01
        estimatedDurationSeconds:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        instructions:
          type: array
          items:
            $ref: '#/components/schemas/RouteInstruction'
        overlays:
          type: array
          items:
            $ref: '#/components/schemas/RouteOverlay'
    RouteInstruction:
      type: object
      required:
        - sequence
        - type
        - floorCode
        - targetFloorCode
        - movementType
        - distanceMeters
      properties:
        sequence:
          type: integer
          format: int32
          minimum: 0
        type:
          type: string
          enum: [START, CONTINUE, TRANSITION, ARRIVE]
        floorCode:
          type: string
        targetFloorCode:
          type: [string, 'null']
        movementType:
          type: [string, 'null']
          enum: [CORRIDOR, STAIRS, ESCALATOR, ELEVATOR, null]
        distanceMeters:
          type: [number, 'null']
          minimum: 0
          multipleOf: 0.01
    RouteOverlay:
      type: object
      required: [floorCode, displayOrder, imageUrl, pixelWidth, pixelHeight]
      properties:
        floorCode:
          type: string
        displayOrder:
          type: integer
          format: int32
        imageUrl:
          type: string
          format: uri-reference
        pixelWidth:
          type: integer
          format: int32
          minimum: 1
          maximum: 2048
        pixelHeight:
          type: integer
          format: int32
          minimum: 1
          maximum: 2048
    ShareRoute:
      type: object
      required: [shareId, routeUrl, qrImageUrl, expiresAt]
      properties:
        shareId:
          type: string
          format: uuid
        routeUrl:
          type: string
          format: uri
        qrImageUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    SharedRoute:
      type: object
      required:
        - shareId
        - routeId
        - mallId
        - graphVersionId
        - kioskCode
        - placeId
        - profile
        - totalDistanceMeters
        - estimatedDurationSeconds
        - createdAt
        - expiresAt
        - instructions
        - overlays
      properties:
        shareId:
          type: string
          format: uuid
        routeId:
          type: string
          format: uuid
        mallId:
          type: string
          format: uuid
        graphVersionId:
          type: string
          format: uuid
        kioskCode:
          type: string
        placeId:
          type: string
          format: uuid
        profile:
          $ref: '#/components/schemas/MovementProfile'
        totalDistanceMeters:
          type: number
          minimum: 0
          multipleOf: 0.01
        estimatedDurationSeconds:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        instructions:
          type: array
          items:
            $ref: '#/components/schemas/RouteInstruction'
        overlays:
          type: array
          items:
            $ref: '#/components/schemas/SharedRouteOverlay'
    SharedRouteOverlay:
      type: object
      required: [floorCode, displayOrder, mapImageUrl, imageUrl, pixelWidth, pixelHeight]
      properties:
        floorCode:
          type: string
        displayOrder:
          type: integer
          format: int32
        mapImageUrl:
          type: [string, 'null']
          format: uri-reference
        imageUrl:
          type: string
          format: uri
        pixelWidth:
          type: integer
          format: int32
          minimum: 1
          maximum: 2048
        pixelHeight:
          type: integer
          format: int32
          minimum: 1
          maximum: 2048
    CreateFeedback:
      type: object
      additionalProperties: false
      required: [rating]
      oneOf:
        - required: [routeId]
          properties:
            routeId:
              type: string
              format: uuid
            shareId:
              type: 'null'
        - required: [shareId]
          properties:
            routeId:
              type: 'null'
            shareId:
              type: string
              format: uuid
      properties:
        routeId:
          type: [string, 'null']
          format: uuid
        shareId:
          type: [string, 'null']
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
    Problem:
      type: object
      required: [title, status, code]
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        correlationId:
          type: string
          minLength: 8
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{7,127}$'
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
